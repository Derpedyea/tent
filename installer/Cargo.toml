[package]
name = "tent-setup"
version = "0.1.0"
edition = "2024"
description = "Offline installer for tent"
license = "MIT"
publish = false

# Standalone: not part of the app's dependency graph.
[workspace]

[dependencies]
ruzstd = "0.9"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation", "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
