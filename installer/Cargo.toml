[package]
name = "tent-setup"
version = "0.1.0"
edition = "2024"
description = "Offline installer for tent"
license = "MIT"
publish = false

# Standalone: not part of the app's dependency graph.
[workspace]

[dependencies]
ruzstd = "0.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
