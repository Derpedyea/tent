[package]
name = "tent"
version = "0.1.0"
edition = "2024"
description = "A small, pretty telnet client built on GPUI and Ghostty's VT core"
license = "MIT"

[dependencies]
gpui = "0.2.2"
libghostty-vt = { version = "0.2.2", default-features = false }
anyhow = "1"
async-channel = "2"
serialport = { version = "4.10", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# xattr 0.2.3 (pulled in by gpui_http_client) uses libc::ENOATTR, removed in libc 0.2.190.
[patch.crates-io]
xattr = { path = "patches/xattr" }
